[package]
name = "sunhoard-magicsvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anchor-lang = "=1.0.2"
bytemuck = { version = "1.17", features = ["derive", "min_const_generics"] }
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor"] }
magicblock-account = "4.3.1"
magicsvm = "0.3.0"
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }
solana-address = "~2.6.1"
solana-clock = "3"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-native-token = "3.0.0"
solana-signer = "3.0.1"
sunhoard = { path = "../programs/sunhoard", features = ["no-entrypoint", "debug"] }
test-utils = { path = "../test-utils/rust", features = ["anchor"] }
